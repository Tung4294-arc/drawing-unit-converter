<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawing Unit Converter - Công cụ chuyển đổi đơn vị bản vẽ</title>
<style>
  :root {
    --bg: #0f0f10;
    --panel: #1a1a1c;
    --panel-2: #222226;
    --border: #2c2c31;
    --text: #e6e6e6;
    --muted: #8a8a90;
    --accent: #E87A2E;
    --accent-hover: #f38d45;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  h1 .dot { color: var(--accent); }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    transition: background 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:disabled {
    background: #3a3a3e;
    color: #666;
    cursor: not-allowed;
  }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.ghost:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  input[type="file"] { display: none; }
  .options {
    background: var(--panel);
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 14px;
  }
  .options .group {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .options .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  .options label.opt {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .options input[type="radio"],
  .options input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }
  #status {
    padding: 10px 24px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  #status.error { color: var(--danger); }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 24px 24px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 420px;
  }
  .panel h2 {
    margin: 0 0 12px 0;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 600;
  }
  .canvas-wrap {
    flex: 1;
    position: relative;
    background: #070708;
    border: 1px dashed var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    min-height: 320px;
  }
  .canvas-wrap canvas,
  .canvas-wrap img {
    max-width: 100%;
    max-height: 70vh;
    object-fit: contain;
    display: block;
  }
  .placeholder {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 40px 20px;
    pointer-events: none;
  }
  .spinner-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,12,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5;
    border-radius: 6px;
  }
  .spinner-overlay.active { display: flex; }
  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(232,122,46,0.18);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 16px;
    border-top: 1px solid var(--border);
  }
  footer .accent { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Drawing Unit Converter<span class="dot">.</span></h1>
  <div class="controls">
    <label class="btn" for="fileInput" id="uploadLabel">Tải ảnh lên</label>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">
    <button class="btn" id="convertBtn" disabled>Xử lý</button>
    <button class="btn ghost" id="downloadBtn" disabled>Tải kết quả</button>
  </div>
</header>

<div class="options">
  <div class="group">
    <span class="label">Đơn vị xuất</span>
    <label class="opt"><input type="radio" name="unit" value="m" checked> Mét (m)</label>
    <label class="opt"><input type="radio" name="unit" value="mm"> Milimét (mm)</label>
  </div>
  <div class="group">
    <span class="label">Xử lý</span>
    <label class="opt"><input type="checkbox" id="doOCR" checked> Chuyển đổi đơn vị</label>
    <label class="opt"><input type="checkbox" id="doStraighten" checked> Làm thẳng nét vẽ</label>
  </div>
</div>

<div id="status">Sẵn sàng. Hãy tải ảnh bản vẽ (PNG/JPG) để bắt đầu.</div>

<main>
  <section class="panel">
    <h2>Ảnh gốc</h2>
    <div class="canvas-wrap" id="wrapOrig">
      <div class="placeholder">Chưa có ảnh nào được tải lên</div>
    </div>
  </section>
  <section class="panel">
    <h2>Kết quả</h2>
    <div class="canvas-wrap" id="wrapResult">
      <div class="placeholder">Kết quả sẽ hiển thị ở đây sau khi xử lý</div>
      <div class="spinner-overlay" id="spinner"><div class="spinner"></div></div>
    </div>
  </section>
</main>

<footer>
  Công cụ dành cho kiến trúc sư · Chạy hoàn toàn trên trình duyệt ·
  <span class="accent">Tesseract.js</span> + <span class="accent">OpenCV.js</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script>
  window.Module = {
    onRuntimeInitialized() { window.__cvReady = true; }
  };
</script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const statusEl = $('status');
  const spinner = $('spinner');

  let originalImage = null;
  let resultCanvas = null;

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  }
  function showSpinner(on) { spinner.classList.toggle('active', on); }

  function waitForOpenCV(timeoutMs) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      (function check() {
        if (window.__cvReady && window.cv && cv.Mat) return resolve();
        if (Date.now() - start > timeoutMs) return reject(new Error('OpenCV load timeout'));
        setTimeout(check, 120);
      })();
    });
  }

  $('fileInput').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      originalImage = img;
      const wrap = $('wrapOrig');
      wrap.innerHTML = '';
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      wrap.appendChild(canvas);
      $('convertBtn').disabled = false;
      setStatus(`Đã tải ảnh: ${f.name} — ${img.width} × ${img.height}px`);
    };
    img.onerror = () => setStatus('Không thể đọc ảnh. Vui lòng thử lại.', true);
    img.src = url;
  });

  // ---------- OCR normalization (fix typical confusions) ----------
  function normalizeOcrText(raw) {
    if (!raw) return '';
    return raw
      .replace(/\u2018|\u2019|\u02BC|\u0060|\u00B4/g, "'")
      .replace(/\u201C|\u201D|\u2033/g, '"')
      .replace(/''/g, '"')
      .replace(/[lI|!\]\[\)\(]/g, '1')
      .replace(/[Oo]/g, '0')
      .replace(/[Ss](?=['"]|\d|$)/g, '5')
      .replace(/[Zz](?=['"]|\d|$)/g, '2')
      .replace(/[Bb](?=['"]|\d|$)/g, '8')
      .replace(/[gq]/g, '9')
      .replace(/\s+/g, '')
      .trim();
  }

  // ---------- Parsing feet / inch ----------
  function parseDimension(rawText) {
    const t = normalizeOcrText(rawText);
    if (!t || t.length < 2) return null;

    // feet + inches: 5'6"  5'-6"  5'6  5'-6"
    let m = t.match(/^(\d+(?:\.\d+)?)['"]-?(\d+(?:\.\d+)?)["']?$/);
    if (m && /['"]/.test(t)) {
      return parseFloat(m[1]) * 0.3048 + parseFloat(m[2]) * 0.0254;
    }
    // feet only
    m = t.match(/^(\d+(?:\.\d+)?)(?:ft|feet|')$/i);
    if (m) return parseFloat(m[1]) * 0.3048;
    // inches only
    m = t.match(/^(\d+(?:\.\d+)?)(?:in|inch|inches|")$/i);
    if (m) return parseFloat(m[1]) * 0.0254;
    return null;
  }

  function formatMeters(meters, unit) {
    if (unit === 'mm') return Math.round(meters * 1000) + ' mm';
    const m = Math.round(meters * 1000) / 1000;
    let s = m.toFixed(3).replace(/\.?0+$/, '');
    return s + ' m';
  }

  // ---------- Merge adjacent OCR words on same line ----------
  function mergeAdjacentWords(words) {
    const valid = words.filter(w =>
      w && w.text && w.bbox && (w.confidence == null || w.confidence > 20)
    );
    const sorted = valid.slice().sort((a, b) => {
      const dy = a.bbox.y0 - b.bbox.y0;
      if (Math.abs(dy) > 10) return dy;
      return a.bbox.x0 - b.bbox.x0;
    });
    const used = new Set();
    const out = [];
    for (let i = 0; i < sorted.length; i++) {
      if (used.has(i)) continue;
      const a = sorted[i];
      const merged = {
        text: a.text,
        bbox: { x0: a.bbox.x0, y0: a.bbox.y0, x1: a.bbox.x1, y1: a.bbox.y1 }
      };
      const height = merged.bbox.y1 - merged.bbox.y0;
      for (let j = i + 1; j < sorted.length; j++) {
        if (used.has(j)) continue;
        const b = sorted[j];
        const sameLine = Math.abs(b.bbox.y0 - merged.bbox.y0) < height * 0.7;
        const gap = b.bbox.x0 - merged.bbox.x1;
        if (!sameLine) continue;
        if (gap > height * 1.2) continue;
        if (gap < -height) continue;
        merged.text += b.text;
        merged.bbox.x1 = Math.max(merged.bbox.x1, b.bbox.x1);
        merged.bbox.y0 = Math.min(merged.bbox.y0, b.bbox.y0);
        merged.bbox.y1 = Math.max(merged.bbox.y1, b.bbox.y1);
        used.add(j);
      }
      used.add(i);
      out.push(merged);
    }
    return out;
  }

  // ---------- Rotate canvas by a multiple of 90° ----------
  function makeRotatedCanvas(srcCanvas, angleDeg) {
    const w = srcCanvas.width, h = srcCanvas.height;
    const a = ((angleDeg % 360) + 360) % 360;
    const rw = (a === 90 || a === 270) ? h : w;
    const rh = (a === 90 || a === 270) ? w : h;
    const c = document.createElement('canvas');
    c.width = rw; c.height = rh;
    const cx = c.getContext('2d');
    cx.save();
    cx.translate(rw / 2, rh / 2);
    cx.rotate(a * Math.PI / 180);
    cx.drawImage(srcCanvas, -w / 2, -h / 2);
    cx.restore();
    return c;
  }

  // ---------- Map bbox from rotated image back to original ----------
  function bboxToOriginalPolygon(bbox, angleDeg, srcW, srcH) {
    const a = ((angleDeg % 360) + 360) % 360;
    const rw = (a === 90 || a === 270) ? srcH : srcW;
    const rh = (a === 90 || a === 270) ? srcW : srcH;
    const corners = [
      { x: bbox.x0, y: bbox.y0 },
      { x: bbox.x1, y: bbox.y0 },
      { x: bbox.x1, y: bbox.y1 },
      { x: bbox.x0, y: bbox.y1 },
    ];
    const cos = Math.cos(-a * Math.PI / 180);
    const sin = Math.sin(-a * Math.PI / 180);
    return corners.map(p => {
      const dx = p.x - rw / 2;
      const dy = p.y - rh / 2;
      return {
        x: dx * cos - dy * sin + srcW / 2,
        y: dx * sin + dy * cos + srcH / 2,
      };
    });
  }

  // ---------- Draw replacement text, rotated to match source orientation ----------
  function drawReplacementTextRotated(ctx, polygon, newText, angleDeg) {
    // polygon: [TL, TR, BR, BL] in original coordinates
    const cx = (polygon[0].x + polygon[2].x) / 2;
    const cy = (polygon[0].y + polygon[2].y) / 2;
    const w = Math.hypot(polygon[1].x - polygon[0].x, polygon[1].y - polygon[0].y);
    const h = Math.hypot(polygon[3].x - polygon[0].x, polygon[3].y - polygon[0].y);
    const padX = Math.max(6, h * 0.3);
    const padY = Math.max(4, h * 0.2);
    const rad = -angleDeg * Math.PI / 180;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rad);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-w / 2 - padX, -h / 2 - padY, w + padX * 2, h + padY * 2);

    let fs = Math.max(12, Math.round(h * 0.95));
    ctx.fillStyle = '#000000';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.font = `700 ${fs}px -apple-system, "Segoe UI", Arial, sans-serif`;
    while (fs > 10 && ctx.measureText(newText).width > w + padX * 2) {
      fs -= 1;
      ctx.font = `700 ${fs}px -apple-system, "Segoe UI", Arial, sans-serif`;
    }
    ctx.fillText(newText, 0, 0);
    ctx.restore();
  }

  function polygonCenter(poly) {
    return { x: (poly[0].x + poly[2].x) / 2, y: (poly[0].y + poly[2].y) / 2 };
  }

  // ---------- Straighten: Hough Line Transform ----------
  function straightenLines(canvas) {
    if (!window.cv || !cv.Mat) throw new Error('OpenCV chưa sẵn sàng');
    const src = cv.imread(canvas);
    const gray = new cv.Mat();
    const edges = new cv.Mat();
    const lines = new cv.Mat();
    let count = 0;
    try {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, gray, new cv.Size(3, 3), 0);
      cv.Canny(gray, edges, 30, 100);

      const minSide = Math.min(canvas.width, canvas.height);
      const minLen = Math.max(20, minSide * 0.02);
      const maxGap = Math.max(10, minLen * 0.4);
      const threshold = Math.max(35, Math.round(minLen * 0.8));
      cv.HoughLinesP(edges, lines, 1, Math.PI / 180, threshold, minLen, maxGap);

      const stroke = Math.max(2, Math.round(minSide / 600));
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = stroke;
      ctx.lineCap = 'round';

      for (let i = 0; i < lines.rows; i++) {
        const x1 = lines.data32S[i * 4];
        const y1 = lines.data32S[i * 4 + 1];
        const x2 = lines.data32S[i * 4 + 2];
        const y2 = lines.data32S[i * 4 + 3];
        let sx1 = x1, sy1 = y1, sx2 = x2, sy2 = y2;
        const dx = Math.abs(x2 - x1);
        const dy = Math.abs(y2 - y1);
        const angle = Math.abs(Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI);
        if (dx > dy && (angle < 8 || Math.abs(angle - 180) < 8)) {
          const yy = Math.round((y1 + y2) / 2);
          sy1 = yy; sy2 = yy;
        } else if (dy > dx && Math.abs(angle - 90) < 8) {
          const xx = Math.round((x1 + x2) / 2);
          sx1 = xx; sx2 = xx;
        }
        ctx.beginPath();
        ctx.moveTo(sx1, sy1);
        ctx.lineTo(sx2, sy2);
        ctx.stroke();
        count++;
      }
      ctx.restore();
    } finally {
      src.delete(); gray.delete(); edges.delete(); lines.delete();
    }
    return count;
  }

  // ---------- Main pipeline ----------
  async function processImage() {
    if (!originalImage) return;
    $('convertBtn').disabled = true;
    $('downloadBtn').disabled = true;
    showSpinner(true);

    try {
      const canvas = document.createElement('canvas');
      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(originalImage, 0, 0);

      const doStraighten = $('doStraighten').checked;
      const doOCR = $('doOCR').checked;
      const unit = document.querySelector('input[name="unit"]:checked').value;

      let lineCount = 0;
      if (doStraighten) {
        setStatus('Đang tải OpenCV và phát hiện đường thẳng...');
        await waitForOpenCV(20000);
        lineCount = straightenLines(canvas);
        setStatus(`Đã vẽ lại ${lineCount} đường thẳng. Tiếp tục OCR...`);
      }

      if (doOCR) {
        const angles = [0, 90, 180, 270];
        const detections = [];
        for (let i = 0; i < angles.length; i++) {
          const a = angles[i];
          setStatus(`Đang OCR ở góc ${a}° (${i + 1}/${angles.length})...`);
          const working = (a === 0) ? canvas : makeRotatedCanvas(canvas, a);
          const result = await Tesseract.recognize(working, 'eng', {
            logger: m => {
              if (m.status && m.progress != null) {
                const pct = Math.round(m.progress * 100);
                setStatus(`OCR ${a}°: ${m.status} — ${pct}% (${i + 1}/${angles.length})`);
              }
            }
          });
          const words = (result.data && result.data.words) || [];
          const merged = mergeAdjacentWords(words);
          for (const w of merged) {
            const val = parseDimension(w.text);
            if (val == null || val <= 0 || val > 1000) continue;
            const poly = bboxToOriginalPolygon(w.bbox, a, canvas.width, canvas.height);
            detections.push({
              text: w.text,
              value: val,
              angle: a,
              polygon: poly,
              confidence: w.confidence || 0,
            });
          }
        }

        // Dedupe: drop detections whose center is close to an already-accepted one
        detections.sort((x, y) => y.confidence - x.confidence);
        const accepted = [];
        const minDist = Math.max(24, Math.min(canvas.width, canvas.height) * 0.02);
        for (const d of detections) {
          const c = polygonCenter(d.polygon);
          const near = accepted.some(a => {
            const ac = polygonCenter(a.polygon);
            return Math.hypot(ac.x - c.x, ac.y - c.y) < minDist;
          });
          if (!near) accepted.push(d);
        }

        for (const d of accepted) {
          drawReplacementTextRotated(ctx, d.polygon, formatMeters(d.value, unit), d.angle);
        }

        setStatus(`Hoàn tất: đã thay ${accepted.length} giá trị đơn vị (OCR ${angles.length} góc xoay).`);
      } else {
        setStatus('Hoàn tất xử lý ảnh.');
      }

      // Render result
      const wrap = $('wrapResult');
      wrap.querySelectorAll('.placeholder').forEach(el => el.remove());
      const prev = wrap.querySelector('canvas');
      if (prev) prev.remove();
      wrap.insertBefore(canvas, spinner);
      resultCanvas = canvas;
      $('downloadBtn').disabled = false;
    } catch (err) {
      console.error(err);
      setStatus('Lỗi xử lý: ' + (err.message || err), true);
    } finally {
      $('convertBtn').disabled = false;
      showSpinner(false);
    }
  }

  $('convertBtn').addEventListener('click', processImage);
  $('downloadBtn').addEventListener('click', () => {
    if (!resultCanvas) return;
    const a = document.createElement('a');
    a.download = 'ban-ve-da-chuyen-doi.png';
    a.href = resultCanvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
})();
</script>

</body>
</html>
